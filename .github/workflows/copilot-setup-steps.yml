# copilot-setup-steps.yml
# This file configures the environment for the GitHub Copilot coding agent.
# It is called automatically by the Copilot agent before it starts working.
# Reference: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/copilot-setup-steps

name: "Copilot Setup Steps"

on:
  workflow_call:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install python-pptx markdown2 reportlab pillow requests

      - name: Install Pandoc (document conversion)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc

      - name: Install Node.js (for MCP servers)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ──────────────────────────────────────────────
      # MCP Server Setup
      # Add your MCP server installations below.
      # See .github/copilot/mcp_config.json for config.
      # ──────────────────────────────────────────────

      # Example: Filesystem MCP server
      # - name: Install Filesystem MCP Server
      #   run: npm install -g @modelcontextprotocol/server-filesystem

      # Example: Web Search MCP server
      # - name: Install Web Search MCP Server
      #   run: npm install -g @modelcontextprotocol/server-brave-search

      - name: Verify setup
        run: |
          python --version
          pandoc --version | head -1
          echo "✅ Copilot environment ready"
