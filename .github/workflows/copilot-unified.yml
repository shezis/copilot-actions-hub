# copilot-unified.yml
# Multi-skill workflow: combines report + PPT in one run via generate_unified.py

name: "🤖 Unified AI Workflow"

"on":
  workflow_dispatch:
    inputs:
      prompt:
        description: "What do you want to create?"
        required: true
        type: string
      model:
        description: "AI model via OpenRouter"
        required: true
        default: "anthropic/claude-sonnet-4-5"
        type: choice
        options:
          - anthropic/claude-sonnet-4-5
          - anthropic/claude-haiku-4-5
          - openai/gpt-4o
          - openai/gpt-4o-mini
          - google/gemini-2.0-flash-001
          - meta-llama/llama-3.3-70b-instruct
          - mistralai/mistral-large
          - deepseek/deepseek-chat-v3-0324
      agent:
        description: "Custom agent persona"
        required: true
        default: "Default"
        type: choice
        options:
          - Default
          - AI Engineer
          - Backend Developer
          - Code Reviewer
          - Frontend Developer
          - Product Manager
          - Security Engineer
          - Software Architect
      format:
        description: "Output format"
        required: false
        default: "markdown"
        type: choice
        options:
          - markdown
          - html
      skill_report:
        description: "Skill: Report Writing"
        required: false
        default: "true"
        type: boolean
      skill_ppt:
        description: "Skill: PPT Generation (also install python-pptx)"
        required: false
        default: "false"
        type: boolean
      mcp_filesystem:
        description: "MCP: Filesystem"
        required: false
        default: "false"
        type: boolean
      mcp_web_search:
        description: "MCP: Web Search"
        required: false
        default: "false"
        type: boolean
      mcp_github:
        description: "MCP: GitHub"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  unified-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install python-pptx (if PPT skill enabled)
        if: ${{ inputs.skill_ppt == true || inputs.skill_ppt == 'true' }}
        run: pip install python-pptx --quiet

      - name: Gather MCP context
        id: mcp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_FILESYSTEM: ${{ inputs.mcp_filesystem }}
          USE_GITHUB: ${{ inputs.mcp_github }}
          USE_WEB_SEARCH: ${{ inputs.mcp_web_search }}
          TOPIC: ${{ inputs.prompt }}
        run: |
          MCP_CTX=""
          if [ "$USE_FILESYSTEM" = "true" ]; then
            FILES=$(find . -type f \( -name "*.md" -o -name "*.json" \) ! -path "./.git/*" | head -20 | tr '\n' ', ')
            MCP_CTX="${MCP_CTX}### Workspace files: ${FILES}"
          fi
          if [ "$USE_GITHUB" = "true" ]; then
            INFO=$(gh repo view --json name,description,topics,language 2>/dev/null || echo "{}")
            MCP_CTX="${MCP_CTX} ### Repo: ${INFO}"
          fi
          if [ "$USE_WEB_SEARCH" = "true" ]; then
            ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['TOPIC']))")
            RES=$(curl -s "https://api.duckduckgo.com/?q=${ENC}&format=json&no_html=1&skip_disambig=1" | python3 -c "import json,sys;d=json.load(sys.stdin);out=(['Summary: '+d['Abstract']] if d.get('Abstract') else []);[out.append('- '+r['Text'][:200]) for r in d.get('RelatedTopics',[])[:5] if isinstance(r,dict) and r.get('Text')];print('\n'.join(out) or 'No results.')" 2>/dev/null || echo "")
            MCP_CTX="${MCP_CTX} ### Web: ${RES}"
          fi
          echo "context=${MCP_CTX}" >> "$GITHUB_OUTPUT"

      - name: Run unified AI generation
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          USER_PROMPT: ${{ inputs.prompt }}
          MODEL: ${{ inputs.model }}
          AGENT: ${{ inputs.agent }}
          FORMAT: ${{ inputs.format }}
          SKILL_REPORT: ${{ inputs.skill_report }}
          SKILL_PPT: ${{ inputs.skill_ppt }}
          MCP_CONTEXT: ${{ steps.mcp.outputs.context }}
        run: python3 .github/scripts/generate_unified.py

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT: ${{ inputs.prompt }}
          SLUG: ${{ steps.generate.outputs.slug }}
          MODEL_USED: ${{ steps.generate.outputs.model_used }}
          TOKENS: ${{ steps.generate.outputs.tokens }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH="openrouter/unified-${SLUG}-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add reports/ presentations/
          git commit -m "feat(unified): ${PROMPT} [model=${MODEL_USED}, tokens=${TOKENS}]"
          git push origin "$BRANCH"
          gh pr create \
            --title "Unified: ${PROMPT}" \
            --body "Generated by Unified AI workflow. Model: ${MODEL_USED} | Tokens: ${TOKENS} | Triggered by: @${ACTOR} | Run: ${RUN_URL}" \
            --base main --head "$BRANCH" --label "ai-generated"
