# copilot-unified.yml
# Unified entry point: pick one or more skills, one or more MCP tools,
# choose a custom agent, then provide a prompt.
# Skills and MCPs are multi-select via individual checkboxes.

name: "🤖 Copilot — Unified Action"

"on":
  workflow_dispatch:
    inputs:
      # ── Skills (tick one or more) ──────────────────────────────────────
      skill_report_writing:
        description: "✅ Skill: Report Writing"
        required: false
        default: "false"
        type: boolean
      skill_ppt_generation:
        description: "✅ Skill: PPT Generation"
        required: false
        default: "false"
        type: boolean
      # ── Agent ──────────────────────────────────────────────────────────
      agent:
        description: "Custom agent persona (defines expertise & style)"
        required: true
        default: "Default Copilot"
        type: choice
        options:
          - Default Copilot
          - AI Engineer
          - Backend Developer
          - Code Reviewer
          - Frontend Developer
          - Product Manager
          - Security Engineer
          - Software Architect
      # ── Prompt ─────────────────────────────────────────────────────────
      prompt:
        description: "Your request / instructions for the agent"
        required: true
        type: string
      output_format:
        description: "Output format"
        required: false
        default: "markdown"
        type: choice
        options:
          - markdown
          - html
          - pdf
          - pptx
      # ── MCP Tools (tick one or more) ───────────────────────────────────
      mcp_filesystem:
        description: "🔌 MCP: Filesystem (read/write workspace files)"
        required: false
        default: "false"
        type: boolean
      mcp_web_search:
        description: "🔌 MCP: Web Search (Brave Search API — needs BRAVE_API_KEY secret)"
        required: false
        default: "false"
        type: boolean
      mcp_github:
        description: "🔌 MCP: GitHub (repo operations via GitHub MCP server)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  dispatch-to-copilot:
    runs-on: ubuntu-latest
    steps:
      - name: Create Copilot task issue
        uses: actions/github-script@v7
        with:
          script: |
            const agent  = `${{ inputs.agent }}`;
            const agentSlug = agent.toLowerCase().replace(/\s+/g, '-');
            const prompt = `${{ inputs.prompt }}`;
            const format = `${{ inputs.output_format }}`;

            // ── Collect selected skills ──────────────────────────────────
            const skillMap = {
              'Report Writing':  ${{ inputs.skill_report_writing }},
              'PPT Generation':  ${{ inputs.skill_ppt_generation }},
            };
            const selectedSkills = Object.entries(skillMap)
              .filter(([, v]) => v)
              .map(([k]) => k);

            if (selectedSkills.length === 0) {
              core.setFailed('❌ Select at least one skill before running.');
              return;
            }

            // ── Collect selected MCP tools ───────────────────────────────
            const mcpMap = {
              'filesystem': ${{ inputs.mcp_filesystem }},
              'web-search':  ${{ inputs.mcp_web_search }},
              'github':      ${{ inputs.mcp_github }},
            };
            const selectedMCPs = Object.entries(mcpMap)
              .filter(([, v]) => v)
              .map(([k]) => k);

            // ── Build issue body ─────────────────────────────────────────
            const skillSlugs    = selectedSkills.map(s => s.toLowerCase().replace(/\s+/g, '-'));
            const skillRefs     = skillSlugs.map(s => `- \`.github/copilot/skills/${s}.md\``).join('\n');
            const skillLabels   = skillSlugs.map(s => `skill:${s}`);
            const skillListMd   = selectedSkills.map(s => `**${s}**`).join(', ');

            const agentBlock = agentSlug !== 'default-copilot'
              ? `\n> **Agent Persona:** Act as the **${agent}** agent. Load persona from \`.github/copilot/agents/${agentSlug}.md\`.`
              : '';

            const mcpBlock = selectedMCPs.length > 0
              ? `\n> **MCP Tools Active:** ${selectedMCPs.map(m => `\`${m}\``).join(', ')}  \n> Load each profile from \`.github/copilot/mcp_profiles/<name>.json\`.`
              : '';

            const skillInstructions = skillSlugs.map((slug, i) =>
              `${i + 1}. **${selectedSkills[i]}** — read \`.github/copilot/skills/${slug}.md\`, execute accordingly`
            ).join('\n');

            const body = [
              `## 🤖 Copilot Unified Action`,
              ``,
              `| Field | Value |`,
              `|-------|-------|`,
              `| **Skills** | ${skillListMd} |`,
              `| **Agent** | ${agent} |`,
              `| **Output Format** | ${format} |`,
              `| **MCP Tools** | ${selectedMCPs.length > 0 ? selectedMCPs.join(', ') : 'none'} |`,
              ``,
              agentBlock,
              mcpBlock,
              ``,
              `---`,
              ``,
              `### 📋 Task`,
              ``,
              prompt,
              ``,
              `---`,
              ``,
              `### ✅ Instructions`,
              ``,
              `Execute each selected skill in order:`,
              ``,
              skillInstructions,
              ``,
              `For all outputs:`,
              `- Produce output in **${format}** format`,
              `- Save reports to \`reports/\`, presentations to \`presentations/\``,
              `- Open a single Pull Request containing all generated content`,
            ].filter(l => l !== null && l !== undefined).join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${selectedSkills.join(' + ')}] ${prompt.substring(0, 60)}${prompt.length > 60 ? '...' : ''}`,
              body,
              labels: ['copilot', ...skillLabels, `agent:${agentSlug}`],
            });

            // Trigger the Copilot coding agent via comment mention
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.data.number,
              body: `@github-copilot Please work on this task. All instructions are in the issue body above.`,
            });

            console.log(`✅ Created issue #${issue.data.number}`);
            console.log(`🔗 ${issue.data.html_url}`);

            core.summary.addHeading('Copilot Task Dispatched', 2);
            core.summary.addTable([
              [{data: 'Field', header: true}, {data: 'Value', header: true}],
              ['Skills', selectedSkills.join(', ')],
              ['MCP Tools', selectedMCPs.length > 0 ? selectedMCPs.join(', ') : 'none'],
              ['Agent', agent],
              ['Issue', `#${issue.data.number}`],
              ['URL', issue.data.html_url],
            ]);
            await core.summary.write();
