# ppt-generation.yml
# Calls OpenRouter via .github/scripts/generate_ppt.py
# Flow: inputs -> MCP context -> python script (JSON slides -> pptx) -> commit + PR

name: "📊 PPT Generation"

"on":
  workflow_dispatch:
    inputs:
      topic:
        description: "Presentation topic or title"
        required: true
        type: string
      model:
        description: "AI model via OpenRouter"
        required: true
        default: "anthropic/claude-sonnet-4-5"
        type: choice
        options:
          - anthropic/claude-sonnet-4-5
          - anthropic/claude-haiku-4-5
          - openai/gpt-4o
          - openai/gpt-4o-mini
          - google/gemini-2.0-flash-001
          - meta-llama/llama-3.3-70b-instruct
          - mistralai/mistral-large
          - deepseek/deepseek-chat-v3-0324
      agent:
        description: "Custom agent persona"
        required: true
        default: "Default"
        type: choice
        options:
          - Default
          - AI Engineer
          - Backend Developer
          - Code Reviewer
          - Frontend Developer
          - Product Manager
          - Security Engineer
          - Software Architect
      presentation_type:
        description: "Type of presentation"
        required: true
        default: "Technical Deep Dive"
        type: choice
        options:
          - Technical Deep Dive
          - Executive Summary
          - Pitch Deck
          - "Educational / Tutorial"
          - Status Update
          - Competitive Analysis
      slides_count:
        description: "Approximate number of slides"
        required: false
        default: "10"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
          - "20"
          - "25"
      audience:
        description: "Target audience"
        required: false
        default: "General"
        type: choice
        options:
          - General
          - Technical
          - "Executive / C-Suite"
          - Investors
          - Customers
      include_speaker_notes:
        description: "Include speaker notes"
        required: false
        default: "true"
        type: boolean
      additional_context:
        description: "Additional requirements or context (optional)"
        required: false
        type: string
      mcp_filesystem:
        description: "MCP: Filesystem (inject workspace file list into context)"
        required: false
        default: "false"
        type: boolean
      mcp_web_search:
        description: "MCP: Web Search (DuckDuckGo instant answers injected into context)"
        required: false
        default: "false"
        type: boolean
      mcp_github:
        description: "MCP: GitHub (inject repo metadata into context)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-ppt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install python-pptx
        run: pip install python-pptx --quiet

      - name: Gather MCP context
        id: mcp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_FILESYSTEM: ${{ inputs.mcp_filesystem }}
          USE_GITHUB: ${{ inputs.mcp_github }}
          USE_WEB_SEARCH: ${{ inputs.mcp_web_search }}
          TOPIC: ${{ inputs.topic }}
        run: |
          MCP_CTX=""
          if [ "$USE_FILESYSTEM" = "true" ]; then
            FILES=$(find . -type f \( -name "*.md" -o -name "*.json" \) ! -path "./.git/*" | head -20 | tr '\n' ', ')
            MCP_CTX="${MCP_CTX}### Workspace files: ${FILES}"
          fi
          if [ "$USE_GITHUB" = "true" ]; then
            INFO=$(gh repo view --json name,description,topics,language 2>/dev/null || echo "{}")
            MCP_CTX="${MCP_CTX} ### Repo: ${INFO}"
          fi
          if [ "$USE_WEB_SEARCH" = "true" ]; then
            ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['TOPIC']))")
            RES=$(curl -s "https://api.duckduckgo.com/?q=${ENC}&format=json&no_html=1&skip_disambig=1" | python3 -c "import json,sys;d=json.load(sys.stdin);out=(['Summary: '+d['Abstract']] if d.get('Abstract') else []);[out.append('- '+r['Text'][:200]) for r in d.get('RelatedTopics',[])[:5] if isinstance(r,dict) and r.get('Text')];print('\n'.join(out) or 'No results.')" 2>/dev/null || echo "")
            MCP_CTX="${MCP_CTX} ### Web: ${RES}"
          fi
          echo "context=${MCP_CTX}" >> "$GITHUB_OUTPUT"

      - name: Generate presentation via OpenRouter
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          MODEL: ${{ inputs.model }}
          AGENT: ${{ inputs.agent }}
          PRES_TYPE: ${{ inputs.presentation_type }}
          SLIDES_COUNT: ${{ inputs.slides_count }}
          AUDIENCE: ${{ inputs.audience }}
          SPEAKER_NOTES: ${{ inputs.include_speaker_notes }}
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
          MCP_CONTEXT: ${{ steps.mcp.outputs.context }}
        run: python3 .github/scripts/generate_ppt.py

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          SLUG: ${{ steps.generate.outputs.slug }}
          MODEL_USED: ${{ steps.generate.outputs.model_used }}
          TOKENS: ${{ steps.generate.outputs.tokens }}
          OUTPUT_FILES: ${{ steps.generate.outputs.output_files }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH="openrouter/ppt-${SLUG}-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add presentations/
          git commit -m "feat(ppt): ${TOPIC} [model=${MODEL_USED}, tokens=${TOKENS}]"
          git push origin "$BRANCH"
          gh pr create \
            --title "Presentation: ${TOPIC}" \
            --body "Generated by PPT Generation workflow. Model: ${MODEL_USED} | Tokens: ${TOKENS} | Files: ${OUTPUT_FILES} | Triggered by: @${ACTOR} | Run: ${RUN_URL}" \
            --base main --head "$BRANCH" --label "ai-generated"
